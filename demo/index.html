<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tk-monitor 演示页</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    button { margin: 4px; padding: 8px 14px; cursor: pointer; }
    #events { margin-top: 24px; border-top: 1px solid #ddd; padding-top: 12px; white-space: pre-wrap; font-size: 12px; background: #f6f8fa; padding: 12px; }
  </style>
</head>
<body>
  <h1>tk-monitor demo</h1>
  <p>打开控制台（debug 模式已开启），点击按钮触发各类事件：</p>
  <div>
    <button id="js-error">JS 运行时错误</button>
    <button id="promise-error">Promise 错误</button>
    <button id="resource-error">资源加载错误</button>
    <button id="xhr-500">请求 404 接口</button>
    <button id="fetch-500">fetch 404 接口</button>
    <button id="slow-xhr">慢请求（>5s）</button>
    <button id="pv">hash 路由跳转（PV）</button>
  </div>
  <h3>上报事件流</h3>
  <div id="events">（等待事件…）</div>
  <script src="../dist/index.umd.js"></script>
  <script src="./demo.js"></script>
</body>
</html>
